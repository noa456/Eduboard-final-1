
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#E8284A;--redL:#FFF0F2;--redM:#F95C73;
  --yellow:#F5C518;--yellowL:#FFFBEA;
  --green:#18C964;--greenL:#E6FFF2;--greenM:#5DDBA5;
  --blue:#3B82F6;--blueL:#EFF6FF;
  --ink:#18182E;--ink2:#3D3D5C;--muted:#8888AA;
  --bg:#F4F6FB;--white:#fff;--border:#E4E6F0;
  --shadow:rgba(24,24,46,0.07);--chatBg:#F0F2F8;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg)}
#app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative}
input,textarea,select{font-family:inherit;outline:none;-webkit-appearance:none}
button{font-family:inherit;cursor:pointer;border:none;transition:opacity .15s,transform .12s}
button:active{opacity:.8;transform:scale(.96)}
::-webkit-scrollbar{display:none}
.card{background:var(--white);border-radius:18px;border:1.5px solid var(--border);box-shadow:0 2px 14px var(--shadow)}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--ink);font-size:14px;font-family:inherit}
.inp:focus{border-color:var(--blue)}
.inp.err{border-color:var(--red)!important}
.btn{border:none;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .12s}
.btn:active{opacity:.8;transform:scale(.96)}
.pill{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.fade{animation:fadeUp .28s ease both}
.popin{animation:pop .22s ease}
.msg{animation:slideUp .18s ease both}
</style>

function set(patch){Object.assign(S,patch);draw();}

// ── DOM ──
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="cls")e.className=v;
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){
    if(c==null||c===false)continue;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return e;
}
const t=s=>document.createTextNode(String(s??""));

function Avatar(acc,size=38,fs=15){
  const bg=acc?(acc.color||acOf(acc.subject)||"#3B82F6"):"#E4E6F0";
  if(acc?.avatar){
    return el("img",{src:acc.avatar,style:{width:size,height:size,borderRadius:"50%",objectFit:"cover",border:"2px solid #fff",flexShrink:0}});
  }
  return el("div",{style:{width:size,height:size,borderRadius:"50%",flexShrink:0,
    background:`linear-gradient(135deg,${bg},${bg}bb)`,
    display:"flex",alignItems:"center",justifyContent:"center",
    fontSize:fs,color:"#fff",fontWeight:700,border:"2px solid #fff"}},
    t((acc?.name||"?").trim()[0].toUpperCase()));
}
function Stars(val,size=13,cb){
  const n=parseFloat(val)||0;
  return el("span",{},...[1,2,3,4,5].map(i=>
    el("span",{style:{color:i<=Math.round(n)?"#F5C518":"#E4E6F0",fontSize:size,cursor:cb?"pointer":"default",userSelect:"none"},
      onClick:cb?()=>cb(i):null},"★")
  ));
}
function Pill(txt,bg,col,extra={}){
  return el("span",{cls:"pill",style:{background:bg,color:col,...extra}},t(txt));
}
function Label(s){return el("div",{style:{color:"#3D3D5C",fontSize:12,fontWeight:700,marginBottom:5}},t(s));}
function SecT(s){return el("div",{style:{color:"#8888AA",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1.1,marginBottom:9}},t(s));}
function Inp(val,cb,ph,err=false,extra={}){
  const e=el("input",{cls:`inp${err?" err":""}`,placeholder:ph,...extra});
  e.value=val;e.addEventListener("input",ev=>cb(ev.target.value));return e;
}
function Textarea(val,cb,ph,rows=4){
  const e=el("textarea",{cls:"inp",placeholder:ph,rows,style:{resize:"none",lineHeight:1.6}});
  e.value=val;e.addEventListener("input",ev=>cb(ev.target.value));return e;
}
function Sel(val,cb,opts,style={}){
  const e=el("select",{cls:"inp",style:{padding:"10px",cursor:"pointer",...style}},
    ...opts.map(o=>el("option",{value:o},t(o))));
  e.value=val;e.addEventListener("change",ev=>cb(ev.target.value));return e;
}
function Btn(lbl,cb,style={}){
  return el("button",{cls:"btn",onClick:cb,style:{fontFamily:"inherit",...style}},t(lbl));
}
function pickImg(cb){
  const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;
  i.onchange=e=>{for(const f of e.target.files){const r=new FileReader();r.onload=ev=>cb({name:f.name,size:fmtB(f.size),dataUrl:ev.target.result});r.readAsDataURL(f);}};i.click();
}
function pickDoc(cb){
  const i=document.createElement("input");i.type="file";i.multiple=true;
  i.onchange=e=>{for(const f of e.target.files){const r=new FileReader();r.onload=ev=>cb({name:f.name,size:fmtB(f.size),dataUrl:ev.target.result});r.readAsDataURL(f);}};i.click();
}
function dlFile(f){if(!f?.dataUrl){alert("Fichier de démonstration.");return;}const a=document.createElement("a");a.href=f.dataUrl;a.download=f.name;a.click();}

// ── Sections ──
function renderSetup(){
  const s=S.setup;
  const wrap=el("div",{style:{padding:"20px 20px 40px",animation:s.nameErr?"shake .45s ease":"fadeUp .3s ease"}});

  // progress
  const pb=el("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:24}});
  if(s.step>1)pb.appendChild(Btn("←",()=>set({setup:{...S.setup,step:s.step-1}}),{background:"none",color:"#8888AA",fontSize:17,padding:0,fontWeight:700}));
  const track=el("div",{style:{flex:1,height:5,background:"#E4E6F0",borderRadius:10}});
  track.appendChild(el("div",{style:{width:`${s.step/3*100}%`,height:"100%",background:"linear-gradient(90deg,#E8284A,#F5C518)",borderRadius:10,transition:"width .3s"}}));
  pb.appendChild(track);
  pb.appendChild(el("span",{style:{color:"#8888AA",fontSize:12,fontWeight:700}},t(`${s.step}/3`)));
  wrap.appendChild(pb);

  if(s.step===1){
    wrap.appendChild(el("h2",{style:{fontFamily:"Georgia,serif",fontSize:24,fontWeight:900,color:"#18182E",marginBottom:5}},"Qui êtes-vous ? 👋"));
    wrap.appendChild(el("p",{style:{color:"#8888AA",fontSize:13,marginBottom:20,lineHeight:1.6}},"Aucun mot de passe requis — accès immédiat."));
    wrap.appendChild(Label("Prénom et nom *"));
    const ni=Inp(s.name,v=>set({setup:{...S.setup,name:v,nameErr:false}}),"ex : Marie Dubois",s.nameErr);
    ni.style.marginBottom="4px";
    ni.addEventListener("keydown",e=>{if(e.key==="Enter")doNext();});
    ni.setAttribute("autofocus","");
    wrap.appendChild(ni);
    if(s.nameErr)wrap.appendChild(el("p",{style:{color:"#E8284A",fontSize:12,marginBottom:10,marginTop:2}},"⚠️ Entrez votre nom pour continuer."));
    const grid=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginTop:14}});
    const rw=el("div");rw.appendChild(Label("Rôle"));rw.appendChild(Sel(s.role,v=>set({setup:{...S.setup,role:v}}),ROLES));grid.appendChild(rw);
    const sw=el("div");sw.appendChild(Label("Matière"));sw.appendChild(Sel(s.subject,v=>set({setup:{...S.setup,subject:v}}),SUBJECTS));grid.appendChild(sw);
    wrap.appendChild(grid);
  }
  if(s.step===2){
    wrap.appendChild(el("h2",{style:{fontFamily:"Georgia,serif",fontSize:24,fontWeight:900,color:"#18182E",marginBottom:5}},"Personnalisez ! 🎨"));
    wrap.appendChild(el("p",{style:{color:"#8888AA",fontSize:13,marginBottom:20}}),"Photo et couleur de profil.");
    const ac=el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:12,marginBottom:20}});
    const ap=el("div",{style:{position:"relative",cursor:"pointer"},onClick:()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>set({setup:{...S.setup,avatar:ev.target.result}});r.readAsDataURL(f);};i.click();}});
    const inner=el("div",{style:{width:90,height:90,borderRadius:"50%",overflow:"hidden",background:`linear-gradient(135deg,${s.color},${s.color}99)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:38,color:"#fff",fontWeight:700,border:"3px solid #fff",boxShadow:"0 3px 16px rgba(0,0,0,.1)"}});
    if(s.avatar)inner.appendChild(el("img",{src:s.avatar,style:{width:"100%",height:"100%",objectFit:"cover"}}));
    else inner.appendChild(t((s.name||"?")[0].toUpperCase()));
    ap.appendChild(inner);
    ap.appendChild(el("div",{style:{position:"absolute",bottom:2,right:2,width:26,height:26,borderRadius:"50%",background:"#fff",border:"1.5px solid #E4E6F0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}},"📷"));
    ac.appendChild(ap);
    if(s.avatar)ac.appendChild(Btn("Supprimer",()=>set({setup:{...S.setup,avatar:null}}),{background:"none",color:"#8888AA",fontSize:12,fontWeight:600}));
    wrap.appendChild(ac);
    wrap.appendChild(Label("Couleur d'avatar"));
    const cg=el("div",{style:{display:"flex",gap:9,flexWrap:"wrap",marginBottom:4}});
    for(const col of COLORS){
      cg.appendChild(el("div",{style:{width:34,height:34,borderRadius:"50%",background:col,cursor:"pointer",border:`3px solid ${s.color===col?"#18182E":"transparent"}`,transition:"border .15s"},onClick:()=>set({setup:{...S.setup,color:col}})}));
    }
    wrap.appendChild(cg);
  }
  if(s.step===3){
    wrap.appendChild(el("h2",{style:{fontFamily:"Georgia,serif",fontSize:24,fontWeight:900,color:"#18182E",marginBottom:5}},"Présentez-vous ✍️"));
    wrap.appendChild(el("p",{style:{color:"#8888AA",fontSize:13,marginBottom:18}}),"Bio optionnelle.");
    const prev=el("div",{cls:"card",style:{padding:"14px 16px",display:"flex",alignItems:"center",gap:13,marginBottom:16}});
    const pa=el("div",{style:{width:52,height:52,borderRadius:"50%",overflow:"hidden",flexShrink:0,background:`linear-gradient(135deg,${s.color},${s.color}99)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"#fff",fontWeight:700}});
    if(s.avatar)pa.appendChild(el("img",{src:s.avatar,style:{width:"100%",height:"100%",objectFit:"cover"}}));
    else pa.appendChild(t((s.name||"?")[0].toUpperCase()));
    prev.appendChild(pa);
    const pd=el("div");
    pd.appendChild(el("div",{style:{fontWeight:800,color:"#18182E",fontSize:15}},t(s.name||"Votre nom")));
    pd.appendChild(Pill(s.role,`${s.color}20`,s.color,{display:"inline-flex",marginTop:4}));
    prev.appendChild(pd);wrap.appendChild(prev);
    wrap.appendChild(Label("Bio (optionnel)"));
    wrap.appendChild(Textarea(s.bio,v=>set({setup:{...S.setup,bio:v}}),"Parlez de vous…",4));
  }

  wrap.appendChild(Btn(s.step<3?"Suivant →":"🚀 Entrer dans EduBoard",doNext,{
    marginTop:24,width:"100%",background:"linear-gradient(135deg,#E8284A,#F95C73)",
    color:"#fff",borderRadius:14,padding:"14px",fontSize:15,fontWeight:800,
    boxShadow:"0 4px 18px rgba(232,40,74,.28)"}));
  return wrap;
}
function doNext(){
  const s=S.setup;
  if(s.step===1&&!s.name.trim()){set({setup:{...s,nameErr:true}});setTimeout(()=>set({setup:{...S.setup,nameErr:false}}),800);return;}
  if(s.step<3){set({setup:{...s,step:s.step+1}});return;}
  const id="u_"+Date.now();
  const acc={id,name:s.name.trim(),role:s.role,subject:s.subject,bio:s.bio,avatar:s.avatar,color:s.color,ratings:[]};
  set({user:acc,accounts:{...S.accounts,[id]:acc},tab:"feed",view:null});
}

function renderTopBar(){

    bar.appendChild(hr);
  }else{
    const main=el("div",{style:{padding:"7px 18px 0"}});
    const hr2=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:11}});
    const logo=el("div",{style:{fontFamily:"Georgia,serif",fontSize:21,fontWeight:900,color:"#18182E"}});
    logo.innerHTML=`Edu<span style="color:#E8284A">Board</span>`;
    const right=el("div",{style:{display:"flex",alignItems:"center",gap:8}});
    if(canPub&&S.tab!=="create")right.appendChild(Btn("+ Publier",()=>set({tab:"create",view:null}),{background:"#E8284A",color:"#fff",borderRadius:10,padding:"7px 13px",fontSize:12,fontWeight:800,boxShadow:"0 2px 10px rgba(232,40,74,.25)"}));
    const av=el("div",{style:{cursor:"pointer"},onClick:()=>set({tab:"profile",view:null})});
    av.appendChild(Avatar(u,34,13));right.appendChild(av);

function renderProfile(){
  const u=S.user;const uc=u.color||"#3B82F6";
  const myPosts=S.posts.filter(p=>p.authorId===u.id);const myRooms=S.rooms.filter(r=>r.members.includes(u.id)).length;

  const hc=el("div",{cls:"card",style:{overflow:"hidden",marginBottom:13}});
  hc.appendChild(el("div",{style:{height:74,background:`linear-gradient(135deg,${uc},${uc}77)`}}));
  const hcb=el("div",{style:{padding:"0 18px 18px",marginTop:-36}});
  hcb.appendChild(Avatar(u,70,28));
  const hci=el("div",{style:{marginTop:9}});
  hci.appendChild(el("div",{style:{fontFamily:"Georgia,serif",fontSize:21,fontWeight:900,color:"#18182E"}},t(u.name)));
  const tr=el("div",{style:{display:"flex",gap:5,marginTop:4,flexWrap:"wrap"}});
  tr.appendChild(Pill(u.role,`${uc}18`,uc));tr.appendChild(Pill(u.subject,"#E4E6F0","#8888AA"));
  hci.appendChild(tr);hci.appendChild(el("div",{style:{color:"#3D3D5C",fontSize:13,lineHeight:1.6,marginTop:9}},t(u.bio||"Aucune description.")));
  hcb.appendChild(hci);hc.appendChild(hcb);wrap.appendChild(hc);
  const brow=el("div",{style:{display:"flex",gap:9,marginBottom:13}});
  brow.appendChild(Btn("✏️ Modifier",()=>{set({editF:{name:u.name,bio:u.bio||"",subject:u.subject,color:u.color||COLORS[3]},view:"editprofile"});},{flex:1,background:"#fff",border:"1.5px solid #E4E6F0",borderRadius:13,padding:11,fontSize:13,fontWeight:700,color:"#3D3D5C"}));
  brow.appendChild(Btn("🚪 Quitter",()=>set({user:null,tab:"feed",view:null}),{flex:1,background:"#FFF0F2",border:"1.5px solid #E8284A",borderRadius:13,padding:11,fontSize:13,fontWeight:700,color:"#E8284A"}));

  for(const s of[{l:"Publications",v:myPosts.length,bg:"#FFF0F2",c:"#E8284A"},{l:"Salons",v:myRooms,bg:"#EFF6FF",c:"#3B82F6"},{l:"Rôle",v:u.role==="Professeur"?"Prof":"Élève",bg:"#E6FFF2",c:"#18C964"}]){
    const sc2=el("div",{style:{background:s.bg,borderRadius:14,padding:"13px 7px",textAlign:"center"}});
    sc2.appendChild(el("div",{style:{fontSize:s.l==="Rôle"?12:21,fontWeight:900,color:s.c,fontFamily:"Georgia,serif",wordBreak:"break-word"}},t(s.v)));
    sc2.appendChild(el("div",{style:{fontSize:11,color:s.c,fontWeight:600,marginTop:2}},t(s.l)));
    sg.appendChild(sc2);
  }
  wrap.appendChild(sg);
  return wrap;
}

function renderCreate(){
  const u=S.user;
  if(S.published){
    return el("div",{style:{padding:"14px 16px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:260,gap:14,animation:"pop .35s ease"}},
      el("div",{style:{width:76,height:76,borderRadius:"50%",background:"#E6FFF2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:38}},"✅"),
      el("div",{style:{fontFamily:"Georgia,serif",fontSize:21,fontWeight:900,color:"#18182E"}},"Publié !"),
      el("div",{style:{color:"#8888AA",fontSize:13}},"Visible par tous les élèves")
    );
  }
  const p=S.pub;
  const wrap=el("div",{cls:"fade",style:{padding:"14px 16px 100px",display:"flex",flexDirection:"column",gap:13}});
  wrap.appendChild(el("div",{style:{fontFamily:"Georgia,serif",fontSize:19,fontWeight:900,color:"#18182E"}},"Nouvelle publication"));
  const ac=el("div",{cls:"card",style:{padding:"11px 14px",display:"flex",alignItems:"center",gap:9,background:"#FFF0F2"}});
  ac.appendChild(Avatar(u,34,14));
  ac.appendChild(el("div",{},el("div",{style:{fontWeight:700,color:"#18182E",fontSize:13}},t(u.name)),el("div",{style:{color:"#8888AA",fontSize:11}},t(`${u.subject} · ${u.role}`))));
  wrap.appendChild(ac);
  wrap.appendChild(el("div",{},Label("Titre *"),Inp(p.title,v=>set({pub:{...S.pub,title:v}}),"ex: Exercice sur les intégrales",!p.title)));
  const g=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}});
  g.appendChild(el("div",{},Label("Matière"),Sel(p.subject,v=>set({pub:{...S.pub,subject:v}}),SUBJECTS)));
  g.appendChild(el("div",{},Label("Type"),Sel(p.type,v=>set({pub:{...S.pub,type:v}}),TYPES)));
  wrap.appendChild(g);
  wrap.appendChild(el("div",{},Label("Contenu / Énoncé"),Textarea(p.desc,v=>set({pub:{...S.pub,desc:v}}),"Énoncé, consignes…",5)));

  wrap.appendChild(Label("📎 Pièces jointes"));

      fl.appendChild(el("div",{style:{background:"#F4F6FB",border:"1.5px solid #E4E6F0",borderRadius:9,padding:"8px 11px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        el("div",{style:{display:"flex",alignItems:"center",gap:7}},el("span",{style:{fontSize:15}},t(fileIco(f.name))),el("div",{},el("div",{style:{color:"#18182E",fontSize:12,fontWeight:600}},t(f.name)),el("div",{style:{color:"#8888AA",fontSize:11}},t(f.size)))),
        Btn("✕",()=>set({pub:{...S.pub,files:S.pub.files.filter((_,j)=>j!==i)}}),{background:"none",color:"#8888AA",fontSize:14,padding:"1px 5px"})
      ));
    }
    wrap.appendChild(fl);
  }
  const fbrow=el("div",{style:{display:"flex",gap:7,marginBottom:4}});
  fbrow.appendChild(Btn("🖼️ Photos",()=>pickImg(f=>set({pub:{...S.pub,files:[...S.pub.files,f]}})),{flex:1,background:"#FFFBEA",border:"2px dashed #FFE066",borderRadius:11,padding:"9px 10px",fontSize:12,fontWeight:700,color:"#996900"}));
  fbrow.appendChild(Btn("📄 Documents",()=>pickDoc(f=>set({pub:{...S.pub,files:[...S.pub.files,f]}})),{flex:1,background:"#E6FFF2",border:"2px dashed #5DDBA5",borderRadius:11,padding:"9px 10px",fontSize:12,fontWeight:700,color:"#18C964"}));
  wrap.appendChild(fbrow);

    if(!S.pub.title.trim())return;

    set({posts:[post,...S.posts],published:true,pub:{title:"",subject:"Maths",type:"Exercice",desc:"",files:[]}});
    setTimeout(()=>set({published:false,tab:"feed"}),1600);
  },{marginTop:4,width:"100%",background:"linear-gradient(135deg,#E8284A,#F95C73)",color:"#fff",borderRadius:14,padding:"14px",fontSize:15,fontWeight:800,boxShadow:"0 5px 20px rgba(232,40,74,.3)"}));

function renderBottomNav(){
  const u=S.user;const canPub=u?.role==="Professeur";
  const nav=el("div",{style:{position:"sticky",bottom:0,left:0,right:0,background:"#fff",borderTop:"1.5px solid #E4E6F0",padding:"9px 6px 22px",display:"flex",justifyContent:"space-around",boxShadow:"0 -3px 16px rgba(26,26,46,.06)",zIndex:10}});
  const items=[{k:"feed",ic:"📚",lb:"Fil"},{k:"chat",ic:"💬",lb:"Salons"},{k:"teachers",ic:"👩‍🏫",lb:"Profs"},...(canPub?[{k:"create",ic:"➕",lb:"Publier"}]:[]),{k:"profile",ic:"👤",lb:"Profil"}];
  for(const item of items){
    const on=S.tab===item.k;
    const ni=el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer"},onClick:()=>set({tab:item.k,view:null})});
    ni.appendChild(el("div",{style:{width:38,height:38,borderRadius:12,background:on?"#FFF0F2":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,transition:"background .18s"}},t(item.ic)));
    ni.appendChild(el("span",{style:{fontSize:10,color:on?"#E8284A":"#8888AA",fontWeight:on?800:500}},t(item.lb)));
    nav.appendChild(ni);
  }
  return nav;
}

// ── Main draw ──
function draw(){
  const root=document.getElementById("app");
  root.innerHTML="";

  if(!S.user){
    // Splash + setup
    const splash=el("div",{style:{background:"linear-gradient(160deg,#E8284A,#F5C518)",minHeight:"100vh",display:"flex",flexDirection:"column"}});
    splash.appendChild(el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",padding:"36px 24px 0"}},
      el("div",{style:{width:88,height:88,borderRadius:26,background:"rgba(255,255,255,.22)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,marginBottom:18,boxShadow:"0 7px 28px rgba(0,0,0,.18)"}},"🎓"),
      el("div",{style:{fontFamily:"Georgia,serif",fontSize:38,fontWeight:900,color:"#fff",letterSpacing:"-1.2px",textAlign:"center",lineHeight:1.05,marginBottom:9}},"EduBoard"),
      el("div",{style:{color:"rgba(255,255,255,.8)",fontSize:14,textAlign:"center",lineHeight:1.6,marginBottom:0}},"Devoirs · Exercices · Discussions")
    ));
    const card2=el("div",{style:{background:"#fff",borderRadius:"26px 26px 0 0",flex:1,marginTop:28}});
    card2.appendChild(renderSetup());
    splash.appendChild(card2);root.appendChild(splash);return;
  }

  root.appendChild(renderTopBar());

  const body=el("div",{style:{flex:1,overflowY:S.view==="roomview"?"hidden":"auto",display:"flex",flexDirection:"column"}});

  if(S.view==="detail")body.appendChild(renderDetail());
  else if(S.view==="profview")body.appendChild(renderProfView());
  else if(S.view==="editprofile")body.appendChild(renderEditProfile());
  else if(S.view==="roomview")body.appendChild(renderRoomChat());
  else if(S.view==="createroom")body.appendChild(renderCreateRoom());
  else if(S.tab==="feed")body.appendChild(renderFeed());
  else if(S.tab==="chat")body.appendChild(renderChat());
  else if(S.tab==="teachers")body.appendChild(renderTeachers());
  else if(S.tab==="profile")body.appendChild(renderProfile());
  else if(S.tab==="create")body.appendChild(renderCreate());

  root.appendChild(body);
  if(!S.view)root.appendChild(renderBottomNav());
}

draw();
</script>
